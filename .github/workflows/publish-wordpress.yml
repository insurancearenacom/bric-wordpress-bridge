name: Pubblica articolo WordPress

on:
  workflow_dispatch:
    inputs:
      title:
        description: Titolo dell'articolo
        required: true
        type: string
      content:
        description: Contenuto HTML dell'articolo
        required: true
        type: string
      status:
        description: Stato WordPress
        required: true
        default: draft
        type: choice
        options:
          - draft
          - publish

permissions:
  contents: read

concurrency:
  group: wordpress-production
  cancel-in-progress: true

jobs:
  publish:
    name: Invia a bricdellavigna.it
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pubblica tramite WordPress REST API
        env:
          WP_URL: https://www.bricdellavigna.it
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ARTICLE_TITLE: ${{ inputs.title }}
          ARTICLE_CONTENT: ${{ inputs.content }}
          ARTICLE_STATUS: ${{ inputs.status }}
        run: |
          set -Eeuo pipefail
          : "${WP_USERNAME:?Missing production secret WP_USERNAME}"
          : "${WP_APP_PASSWORD:?Missing production secret WP_APP_PASSWORD}"

          payload=$(jq -n \
            --arg title "$ARTICLE_TITLE" \
            --arg content "$ARTICLE_CONTENT" \
            --arg status "$ARTICLE_STATUS" \
            '{title:$title,content:$content,status:$status}')

          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT

          http_status=$(curl --ipv4 --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --header "Content-Type: application/json; charset=utf-8" \
            --header "User-Agent: bric-wordpress-bridge/2.0" \
            --user "$WP_USERNAME:$WP_APP_PASSWORD" \
            --data "$payload" \
            "$WP_URL/wp-json/wp/v2/posts")

          response=$(<"$response_file")

          if (( http_status < 200 || http_status >= 300 )); then
            echo "::error::WordPress REST API returned HTTP $http_status"
            jq -c '{code,message,data}' <<<"$response" 2>/dev/null || printf '%s\n' "$response"
            exit 1
          fi

          echo "Articolo creato: id=$(jq -r '.id' <<<"$response") status=$(jq -r '.status' <<<"$response") link=$(jq -r '.link' <<<"$response")"
