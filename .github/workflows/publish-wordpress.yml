name: Pubblica articolo WordPress

on:
  workflow_dispatch:
    inputs:
      title:
        description: Titolo dell'articolo
        required: true
        type: string
      content:
        description: Contenuto HTML dell'articolo
        required: true
        type: string
      status:
        description: Stato WordPress
        required: true
        default: draft
        type: choice
        options:
          - draft
          - publish

permissions:
  contents: read

concurrency:
  group: wordpress-production
  cancel-in-progress: false

jobs:
  publish:
    name: Invia a bricdellavigna.it
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pubblica tramite WordPress REST API
        env:
          WP_URL: https://www.bricdellavigna.it
          BRIC_BRIDGE_TOKEN: ${{ secrets.BRIC_BRIDGE_TOKEN }}
          ARTICLE_TITLE: ${{ inputs.title }}
          ARTICLE_CONTENT: ${{ inputs.content }}
          ARTICLE_STATUS: ${{ inputs.status }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from urllib.error import HTTPError

          endpoint = os.environ["WP_URL"].rstrip("/") + "/wp-json/wp/v2/posts"
          payload = json.dumps({
              "title": os.environ["ARTICLE_TITLE"],
              "content": os.environ["ARTICLE_CONTENT"],
              "status": os.environ["ARTICLE_STATUS"],
          }).encode()
          request = urllib.request.Request(
              endpoint,
              data=payload,
              method="POST",
              headers={
                  "Authorization": f'Bearer {os.environ["BRIC_BRIDGE_TOKEN"]}',
                  "Content-Type": "application/json; charset=utf-8",
                  "User-Agent": "bric-wordpress-bridge/1.0",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except HTTPError as error:
              print(f"WordPress HTTP {error.code}: {error.read().decode('utf-8', errors='replace')}")
              raise
          print(f'Articolo creato: id={result["id"]} status={result["status"]} link={result["link"]}')
          PY
