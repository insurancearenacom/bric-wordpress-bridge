name: Pubblica articolo WordPress

on:
  workflow_dispatch:
    inputs:
      title:
        description: Titolo dell'articolo
        required: true
        type: string
      content:
        description: Contenuto HTML dell'articolo
        required: true
        type: string
      status:
        description: Stato WordPress
        required: true
        default: draft
        type: choice
        options:
          - draft
          - publish

permissions:
  contents: read

concurrency:
  group: wordpress-production
  cancel-in-progress: true

jobs:
  publish:
    name: Invia a bricdellavigna.it
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pubblica tramite WordPress REST API
        env:
          WP_URL: https://www.bricdellavigna.it
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ARTICLE_TITLE: ${{ inputs.title }}
          ARTICLE_CONTENT: ${{ inputs.content }}
          ARTICLE_STATUS: ${{ inputs.status }}
        run: |
          payload=$(jq -n --arg title "$ARTICLE_TITLE" --arg content "$ARTICLE_CONTENT" --arg status "$ARTICLE_STATUS" '{title:$title,content:$content,status:$status}')
          credentials=$(printf '%s:%s' "$WP_USERNAME" "$WP_APP_PASSWORD" | base64 -w0)
          response=$(curl --ipv4 --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $credentials" \
            --header "Content-Type: application/json; charset=utf-8" \
            --header "User-Agent: bric-wordpress-bridge/1.0" \
            --data "$payload" \
            "$WP_URL/wp-json/wp/v2/posts")
          echo "Articolo creato: id=$(jq -r '.id' <<<"$response") status=$(jq -r '.status' <<<"$response") link=$(jq -r '.link' <<<"$response")"
